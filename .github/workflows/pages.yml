# Публикует приложение polish-quiz на GitHub Pages.
# Один раз включить: Settings → Pages → Source: GitHub Actions.
name: Deploy app to GitHub Pages
on:
  push:
    paths: ['polish-quiz/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset version (cache busting)
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" polish-quiz/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: polish-quiz
      - id: deployment
        uses: actions/deploy-pages@v4
